[project]
name = "django-webhook-dispatcher"
version = "0.1.0"
description = "Reliable outgoing webhook delivery service built on Django and Celery"
readme = "README.md"
requires-python = ">=3.13.13"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1.2",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
